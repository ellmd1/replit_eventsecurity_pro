{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body text-center">
                    <h1 class="text-danger mb-4">
                        <i data-feather="alert-triangle" class="feather-lg mb-3"></i>
                        Error
                    </h1>
                    <p class="lead">{{ error }}</p>
                    <a href="{{ url_for('dashboard') }}" class="btn btn-primary mt-3">
                        <i data-feather="home" class="feather-sm"></i>
                        Return to Dashboard
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
