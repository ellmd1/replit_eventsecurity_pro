{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h4 class="mb-0">Security Recommendations – {{ report.title }}</h4>
      <a class="btn btn-outline-secondary" href="{{ url_for('add_risk_assessment', event_id=report.id) }}">Back to Risk Assessment</a>
    </div>
    <div class="card-body">
      <form method="POST">
        {# Include the lower part of create_event_report.html (starting from Risk Assessments) #}
        {% include 'partials/event_report_lower.html' %}
      </form>
    </div>
  </div>
</div>
{% endblock %}
