<hr>

<hr>
<h5 class="mt-4">Security Recommendations</h5>

<div class="row">
    <div class="col-md-6 mb-3">
        <label for="security_staff_count" class="form-label">Security Staff Count</label>
        <input type="number" class="form-control" id="security_staff_count" name="security_staff_count" value="{{ report.security_staff_count or 0 }}">
    </div>
    <div class="col-md-6 mb-3">
        <label for="incidents_reported" class="form-label">Incidents Reported</label>
        <input type="number" class="form-control" id="incidents_reported" name="incidents_reported" value="{{ report.incidents_reported or 0 }}">
    </div>
</div>

<div class="mb-3">
    <label for="security_protocols" class="form-label">Security Protocols</label>
    <textarea class="form-control" id="security_protocols" name="security_protocols" rows="3">{{ report.security_protocols or '' }}</textarea>
</div>

<div class="mb-3">
    <label for="emergency_response_plan" class="form-label">Emergency Response Plan</label>
    <textarea class="form-control" id="emergency_response_plan" name="emergency_response_plan" rows="3">{{ report.emergency_response_plan or '' }}</textarea>
</div>

<hr>
<h5 class="mt-4">Post-Event Report</h5>

<div class="mb-3">
    <label for="security_measures" class="form-label">Security Measures</label>
    <textarea class="form-control" id="security_measures" name="security_measures" rows="3">{{ report.security_measures or '' }}</textarea>
</div>

<div class="mb-3">
    <label for="incident_response" class="form-label">Incident Response</label>
    <textarea class="form-control" id="incident_response" name="incident_response" rows="3">{{ report.incident_response or '' }}</textarea>
</div>

<div class="mb-3">
    <label for="lessons_learned" class="form-label">Lessons Learned</label>
    <textarea class="form-control" id="lessons_learned" name="lessons_learned" rows="3">{{ report.lessons_learned or '' }}</textarea>
</div>

<div class="mb-3">
    <label for="recommendations" class="form-label">Recommendations</label>
    <textarea class="form-control" id="recommendations" name="recommendations" rows="3">{{ report.recommendations or '' }}</textarea>
</div>

<div class="d-flex justify-content-end">
    <a href="{{ url_for('view_report', report_id=report.id) }}" class="btn btn-secondary me-2">Cancel</a>
    <button type="submit" class="btn btn-primary">Save Report</button>
</div>
