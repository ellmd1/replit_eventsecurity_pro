{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="row">
        <div class="col-md-12">
            <h2 class="mb-4">Risk Assessment Dashboard</h2>
            <div class="row">
                <div class="col-md-6 mb-4">
                    <div class="card h-100">
                        <div class="card-body">
                            <h5 class="card-title">Quick Navigation</h5>
                            <div class="list-group">
                                <a href="{{ url_for('index') }}" class="list-group-item list-group-item-action">
                                    <i data-feather="list"></i> Browse Recent Events
                                </a>
                                <a href="{{ url_for('comparative_search') }}" class="list-group-item list-group-item-action">
                                    <i data-feather="search"></i> Compare Events
                                </a>
                                <a href="{{ url_for('chat') }}" class="list-group-item list-group-item-action">
                                    <i data-feather="message-square"></i> Chat Assistant
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 mb-4">
                    <div class="card h-100">
                        <div class="card-body">
                            <h5 class="card-title">Recent Activity</h5>
                            <p class="text-muted">Activity dashboard coming soon...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
