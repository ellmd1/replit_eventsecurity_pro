{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header">
            <h4 class="mb-0">{{ 'Edit Event Report' if report else 'Create New Event Report' }}</h4>
        </div>
        <div class="card-body">
            <form action="{% if report %}{{ url_for('edit_event_report', report_id=report.id) }}{% else %}{{ url_for('create_event_report') }}{% endif %}" method="POST">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="title" class="form-label">Event Title</label>
                        <input type="text" class="form-control" id="title" name="title" value="{{ report.title if report else '' }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="date" class="form-label">Event Date</label>
                        <input type="date" class="form-control" id="date" name="date" value="{{ report.date.strftime('%Y-%m-%d') if report else '' }}" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="location" class="form-label">Location</label>
                        <input type="text" class="form-control" id="location" name="location" value="{{ report.location if report else '' }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="incident_type" class="form-label">Incident Type</label>
                        <input type="text" class="form-control" id="incident_type" name="incident_type" value="{{ report.incident_type if report else '' }}" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">Description</label>
                    <textarea class="form-control" id="description" name="description" rows="3" required>{{ report.description if report else '' }}</textarea>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="risk_level" class="form-label">Risk Level</label>
                        <select class="form-select" id="risk_level" name="risk_level" required>
                            {% for level in ['Low','Medium','High'] %}
                            <option value="{{ level }}" {% if report and report.risk_level==level %}selected{% endif %}>{{ level }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="venue_type" class="form-label">Venue Type</label>
                        <input type="text" class="form-control" id="venue_type" name="venue_type" value="{{ report.venue_type if report else '' }}">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="attendance" class="form-label">Attendance</label>
                        <input type="number" class="form-control" id="attendance" name="attendance" value="{{ report.attendance if report else '' }}">
                    </div>
                </div>

                <hr>
                <h5 class="mt-4">Security Details</h5>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="security_staff_count" class="form-label">Security Staff Count</label>
                        <input type="number" class="form-control" id="security_staff_count" name="security_staff_count" value="{{ report.security_staff_count if report else 0 }}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="incidents_reported" class="form-label">Incidents Reported</label>
                        <input type="number" class="form-control" id="incidents_reported" name="incidents_reported" value="{{ report.incidents_reported if report else 0 }}">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="security_measures" class="form-label">Security Measures</label>
                    <textarea class="form-control" id="security_measures" name="security_measures" rows="3">{{ report.security_measures if report else '' }}</textarea>
                </div>

                <div class="mb-3">
                    <label for="security_protocols" class="form-label">Security Protocols</label>
                    <textarea class="form-control" id="security_protocols" name="security_protocols" rows="3">{{ report.security_protocols if report else '' }}</textarea>
                </div>
                
                <div class="mb-3">
                    <label for="emergency_response_plan" class="form-label">Emergency Response Plan</label>
                    <textarea class="form-control" id="emergency_response_plan" name="emergency_response_plan" rows="3">{{ report.emergency_response_plan if report else '' }}</textarea>
                </div>

                <hr>
                <h5 class="mt-4">Post-Event Analysis</h5>

                <div class="mb-3">
                    <label for="lessons_learned" class="form-label">Lessons Learned</label>
                    <textarea class="form-control" id="lessons_learned" name="lessons_learned" rows="3">{{ report.lessons_learned if report else '' }}</textarea>
                </div>
                
                <div class="mb-3">
                    <label for="recommendations" class="form-label">Recommendations</label>
                    <textarea class="form-control" id="recommendations" name="recommendations" rows="3">{{ report.recommendations if report else '' }}</textarea>
                </div>

                <div class="d-flex justify-content-end">
                    <a href="{{ url_for('index') }}" class="btn btn-secondary me-2">Cancel</a>
                    <button type="submit" class="btn btn-primary">{{ 'Save Changes' if report else 'Create Report' }}</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
