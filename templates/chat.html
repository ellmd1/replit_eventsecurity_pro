{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="card bg-dark">
        <div class="card-header">
            <h4>Security Event Assistant</h4>
        </div>
        <div class="card-body">
            <div id="chatMessages" class="chat-messages mb-4" style="height: 400px; overflow-y: auto;">
                <!-- Chat messages will appear here -->
            </div>
            <form id="chatForm" class="mt-3">
                <div class="input-group">
                    <input type="text" id="queryInput" class="form-control" placeholder="Type your question here..." required>
                    <button type="submit" class="btn btn-primary">Send</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="https://unpkg.com/feather-icons"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
<script>console.log('Chat page loaded');</script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        console.log('Chat page DOM loaded');
    });
</script>
{% endblock %}
