{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="row">
        <div class="col-md-12">
            <h4 class="mb-4">Event Database Chat</h4>
            <div class="card">
                <div class="card-body">
                    <div class="chat-messages mb-3" id="chatMessages" style="height: 400px; overflow-y: auto;">
                        <!-- Messages will be inserted here -->
                    </div>
                    <form id="chatForm" class="d-flex gap-2">
                        <input type="text" class="form-control" id="queryInput" placeholder="Ask about events (e.g., 'Show me high risk events from this year')" required>
                        <button type="submit" class="btn btn-primary">Send</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
