<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risk Assessment Tool</title>
    <link href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.css" rel="stylesheet">
    <style>
        .chat-messages {
            background: var(--bs-dark);
            border-radius: 0.25rem;
            padding: 1rem;
            height: 400px;
            overflow-y: auto;
        }
        .chat-message {
            margin-bottom: 1rem;
        }
        .chat-message .message-content {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 1rem;
            max-width: 75%;
        }
        .chat-message.user {
            text-align: right;
        }
        .chat-message.user .message-content {
            background: var(--bs-primary);
            color: white;
        }
        .chat-message.assistant .message-content {
            background: var(--bs-secondary);
            color: white;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Risk Assessment Tool</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/browse">Browse Reports</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/comparative-search">Compare Events</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/chat">Chat Assistant</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/scenario-builder">Scenario Builder</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/access_logs">Access Logs</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            feather.replace();
        });
    </script>
</body>
</html>
