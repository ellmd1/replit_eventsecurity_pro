<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Event Management Platform</title>
    <!-- Force CSS reload by adding version parameter -->
    <link href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css?v=1" rel="stylesheet" crossorigin="anonymous">
    <!-- Add debug message -->
    <script>console.log('Base template loaded successfully');</script>
</head>
<body>
    <div class="container-fluid">
        <nav class="navbar navbar-expand-lg bg-body-tertiary mb-4">
            <div class="container-fluid">
                <span class="navbar-brand">Security Platform</span>
            </div>
        </nav>

        <div class="container">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            {% block content %}{% endblock %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    {% block extra_scripts %}{% endblock %}

    <!-- Add debug script -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Page fully loaded');
        });
    </script>
</body>
</html>
